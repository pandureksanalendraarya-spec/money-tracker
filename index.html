<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Money Tracker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#0d1211">
        <link rel="icon" href="icon-192.png">
    </head>
    <body>
        <header>
        <div>
            <p class="sapaan" id="sapaan"></p>
            <p class="saldo-label" id="saldo-label">Saldo</p>
            <p id="balance">Rp 0</p>
        </div>
        <div class="menu-wrap">
            <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu lainnya" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                </svg>
            </button>
            <div id="menu-pop" class="menu-pop" hidden>
                <button type="button" id="export-data">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
                    Export data
                </button>
                <button type="button" id="import-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
                    Import data
                </button>
                <input type="file" id="import-data" hidden>
                <button type="button" id="hapus-contoh">Hapus data contoh</button>
                <button type="button" id="periode-baru">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6M20 10a8 8 0 0 0-14-3M4 14a8 8 0 0 0 14 3"/></svg>
                    Mulai periode baru
                </button>
                <button type="button" id="reset-all" class="danger">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v4"/></svg>
                    Reset semua data
                </button>
            </div>
        </div>
        </header>

        <div id="empty-state" class="kosong">
            <h2>Yuk mulai catat</h2>
            <p>Pilih satu langkah kecil. Sisanya muncul sendiri begitu ada data.</p>
            <button type="button" class="ajak" data-panel="panel-income" data-judul="Tambah Pemasukan">
    <span class="ikon-bulat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </span>
    <span class="teks"><strong>Catat pemasukan pertama</strong><small>Gaji, uang saku, atau freelance</small></span>
</button>

<button type="button" class="ajak" data-panel="panel-budget" data-judul="Tambah Budget">
    <span class="ikon-bulat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
    </span>
    <span class="teks"><strong>Atur budget bulanan</strong><small>Batas jajan biar saldo aman</small></span>
</button>

<button type="button" class="ajak" data-panel="panel-goal" data-judul="Tambah Goals">
    <span class="ikon-bulat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
    </span>
    <span class="teks"><strong>Bikin goal pertama</strong><small>Sepeda, kamera, liburan</small></span>
</button>
<button type="button" id="contoh-kosong" class="outline">Coba dengan data contoh</button>
        </div>

        <main class="grid" id="konten" hidden>
            <div id="insight" class="insight" hidden></div>
            <div class="stats">
                <div>
                    <small>Pemasukan</small>
                    <strong id="stat-income" class="plus">+ 0</strong>
                </div>
                <div>
                    <small>Pengeluaran</small>
                    <strong id="stat-expense">- 0</strong>
                </div>
            </div>

            <section class="budget" id="kartu-budget" hidden>
                <div class="baris">
                    <h2>Budget</h2>
                    <p id="budget-info"></p>
                </div>
                <div class="bar"><div id="budget-bar"></div></div>
            </section>

            <section id="kartu-chart" hidden>
                <h2>7 hari terakhir</h2>
                <div id="chart" class="chart"></div>
            </section>

            <section id="kartu-kategori" hidden>
    <h2>Per kategori</h2>
    <div id="kategori-bar" class="kat-bar"></div>
    <ul id="kategori-list"></ul>
</section>

            <section id="kartu-goals" hidden>
                <ul id="goal-list"></ul>
            </section>

            <section id="kartu-terakhir" hidden>
                <h2>Terakhir</h2>
                <ul id="terakhir-list"></ul>
            </section>
        </main>

        <div id="fab-backdrop"></div>

        <div id="fab-menu" class="fab-menu">
            <button type="button" class="fab-item" data-panel="panel-budget" style="--i: 3">
    <span class="ikon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></span><span class="label">Budget</span>
</button>
<button type="button" class="fab-item" data-panel="panel-expense" style="--i: 2">
    <span class="ikon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span><span class="label">Pengeluaran</span>
</button>
<button type="button" class="fab-item" data-panel="panel-goal" style="--i: 1">
    <span class="ikon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span><span class="label">Goals</span>
</button>
<button type="button" class="fab-item" data-panel="panel-income" style="--i: 0">
    <span class="ikon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span><span class="label">Pemasukan</span>
</button>
            <button type="button" id="fab" aria-label="Tambah data">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
        </div>

        <dialog id="modal">
            <div class="modal-head">
                <h2 id="modal-title">Mau Tambah apa?</h2>
                <button type="button" id="modal-close" class="icon-btn" aria-label="Tutup">✕</button>
            </div>

            <div id="panel-income" class="panel" hidden>
                <form>
                    <label for="income-date">Tanggal</label>
                    <input type="date" id="income-date">

                    <label for="income-desc">Deskripsi</label>
                    <input type="text" id="income-desc">

                    <label>Tipe</label>
                    <div class="segmen">
                        <button type="button" data-nilai="income" class="aktif">Income</button>
                        <button type="button" data-nilai="other">Lainnya</button>
                    </div>
                    <input type="hidden" id="income-type" value="income">

                    <label for="income-amount">Jumlah</label>
                    <div class="input-rp">
                        <span>Rp</span>
                        <input type="text" inputmode="numeric" class="uang" id="income-amount">
                    </div>
                    <p class="hint">Titik ribuan muncul otomatis saat mengetik</p>

                    <button type="button" id="add-income">Simpan</button>
                </form>
            </div>

            <div id="panel-goal" class="panel" hidden>
                <form>
                    <label for="goal-name">Nama Goal</label>
                    <input type="text" id="goal-name">

                    <label for="goal-target">Target (Rp)</label>
                    <input type="text" inputmode="numeric" class="uang" id="goal-target">

                    <label for="goal-amount">Setoran (Rp)</label>
                    <input type="text" inputmode="numeric" class="uang" id="goal-amount">

                    <button type="button" id="add-goal">Setoran ke Goal</button>
                </form>
            </div>

            <div id="panel-expense" class="panel" hidden>
                <form>
                    <label for="expense-date">Tanggal</label>
                    <input type="date" id="expense-date">

                    <label for="expense-desc">Pengeluaran</label>
                    <input type="text" id="expense-desc">

                    <label>Kategori</label>
<div class="pilih-kat">
    <button type="button" data-kat="makan" class="aktif">Makan</button>
    <button type="button" data-kat="transport">Transport</button>
    <button type="button" data-kat="belanja">Belanja</button>
    <button type="button" data-kat="lainnya">Lainnya</button>
</div>
<input type="hidden" id="expense-category" value="makan">

                    <label for="expense-amount">Jumlah (Rp)</label>
                    <input type="text" inputmode="numeric" class="uang" id="expense-amount">

                    <button type="button" id="add-expense">Simpan</button>
                </form>
            </div>

            <div id="panel-budget" class="panel" hidden>
                <form>
                    <label for="budget-target">Target (Rp)</label>
                    <input type="text" inputmode="numeric" class="uang" id="budget-target">

                    <button type="button" id="save-budget">Simpan Budget</button>
                </form>
            </div>

            <div id="panel-nominal" class="panel" hidden>
                <form>
                    <label for="nominal-input" id="nominal-label">Nominal (Rp)</label>
                    <input type="text" inputmode="numeric" class="uang" id="nominal-input">

                    <button type="button" id="nominal-simpan">Simpan</button>
                </form>
            </div>

            <div id="panel-goal-aksi" class="panel" hidden>
                <p id="goal-aksi-info" class="info"></p>
                <button type="button" id="aksi-setor">+ Setor</button>
                <button type="button" id="aksi-kebeli" class="sekunder">Tandai sudah kebeli</button>
                <button type="button" id="aksi-hapus" class="danger">Hapus goal</button>
            </div>

            <div id="panel-transaksi-aksi" class="panel" hidden>
                <p id="transaksi-info" class="info"></p>
                <button type="button" id="transaksi-edit">Edit Nominal</button>
                <button type="button" id="transaksi-hapus" class="danger">Hapus</button>
            </div>
        </dialog>
    </body>
</html>
