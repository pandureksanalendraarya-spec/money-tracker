<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Money Tracker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#0f766e">
        <link rel="icon" href="icon-192.png">
    </head>
    <body>
        <header>
        <h1>Money Tracker</h1>
        <div class="aksi">
            <button type="button" id="export-data">Export</button>
            <button type="button" id="import-btn">Import</button>
            <input type="file" id="import-data" hidden>
            <button type="button" id="reset-all" class="danger">Reset Semua Data</button>
        </div>
        </header>

        <p id="empty-state" class="empty">
            Buat Planning
            <small>Tekan + untuk mulai</small>
        </p>

        <main class="grid" id="konten" hidden>
            <section class="summary">
                <h2>Saldo</h2>
                <p id="balance">Rp 0</p>
            </section>

            <section class="income" id="kartu-income" hidden>
                <h2>Pemasukan</h2>
                <ul id="income-list"></ul>
            </section>

            <section id="kartu-goals" hidden>
                <h2>Goals</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Goals</th>
                            <th>Terget</th>
                            <th>Terkumpul</th>
                            <th>Progress</th>
                            <th>Kebeli</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="goal-list"></tbody>
                </table>
            </section>

            <section class="expense" id="kartu-expense" hidden>
                <h2>Pengeluaran Harian</h2>
                <p id="expense-today"></p>
                <ul id="expense-list"></ul>
                <button type="button" id="reset-expenses" class="danger small">Mulai Periode Baru</button>
            </section>

            <section class="budget" id="kartu-budget" hidden>
                <h2>Budget Bulanan</h2>
                <p id="budget-info"></p>
                <div class="bar"><div id="budget-bar"></div></div>
            </section>
        </main>

        <button type="button" id="fab" aria-label="Tambah data">+</button>

        <dialog id="modal">
            <div class="modal-head">
            <button type="button" id="modal-back" class="small" hidden> <- </button>
            <h2 id="modal-title">Mau tambah apa?</h2>
            <button type="button" id="modal-close" class="small" aria-label="Tutup">X</button>
            </div>

            <div id="pilihan" class="pilihan">
                <button type="button" data-panel="panel-income">Pemasukan</button>
                <button type="button" data-panel="panel-goal">Goals</button>
                <button type="button" data-panel="panel-expense">Pengeluaran</button>
                <button type="button" data-panel="panel-budget">Budget</button>
            </div>

            <div id="panel-income" class="panel" hidden>
                <form>
                    <label for="income-desc">Deskripsi</label>
                    <input type="text" id="income-desc">

                    <label for="income-category">Kategori</label>
                    <input type="text" id="income-category">

                    <label for="income-type">Tipe</label>
                    <select id="income-type">
                        <option value="income">Income</option>
                        <option value="other">Lainnya</option>
                    </select>

                    <label for="income-amount">Jumlah (Rp)</label>
                    <input type="number" id="income-amount">

                    <button type="button" id="add-income">Simpan Pemasukan</button>
                </form>
            </div>

            <div id="panel-goal" class="panel" hidden>
                <form>
                    <label for="goal-name">Nama Goal</label>
                    <input type="text" id="goal-name">

                    <label for="goal-target">Target (Rp)</label>
                    <input type="number" id="goal-target">

                    <label for="goal-amount">Setoran (Rp)</label>
                    <input type="number" id="goal-amount">

                    <button type="button" id="add-goal">Setoran ke Goal</button>
                </form>
            </div>

            <div id="panel-expense" class="panel" hidden>
                <form>
                    <label for="expense-date">Tanggal</label>
                    <input type="date" id="expense-date">

                    <label for="expense-desc">Pengeluaran</label>
                    <input type="text" id="expense-desc">

                    <label for="expense-amount">Jumlah (Rp)</label>
                    <input type="number" id="expense-amount">

                    <button type="button" id="add-expense">Simpan</button>
                </form>
            </div>

            <div id="panel-budget" class="panel" hidden>
                <form>
                    <label for="budget-target">Target (Rp)</label>
                    <input type="number" id="budget-target">

                    <button type="button" id="save-budget">Simpan Budget</button>
                </form>
            </div>
        </dialog>
    </body>
</html>
